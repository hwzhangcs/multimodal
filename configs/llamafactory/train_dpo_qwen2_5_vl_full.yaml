# Settings of the final run reported in README.md: bf16 LoRA (no quantization)
# on 2 GPUs. Effective batch = 1 per device x 16 accumulation x 2 GPUs = 32.
# On more GPUs, lower gradient_accumulation_steps to keep the batch at 32.

### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
trust_remote_code: true
freeze_vision_tower: true
freeze_multi_modal_projector: true

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_target: all
pref_beta: 0.1
pref_loss: sigmoid

### dataset
dataset: qwen2_5_vl_dpo_full
template: qwen2_vl
cutoff_len: 2048
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: saves/qwen2_5_vl_3b_lora_dpo_full
logging_steps: 1
save_steps: 1000
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 4.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
bf16: true
gradient_checkpointing: true
ddp_timeout: 18000000
flash_attn: fa2
